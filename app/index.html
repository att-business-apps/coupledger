/* interactive button feedback */
.go,.act i,.menu{-webkit-tap-highlight-color:transparent}.go{position:relative;overflow:hidden;transition:transform .12s,background .25s}.go:active:not(:disabled){transform:scale(.97)}

@keyframes shm{from{background-position:120% 0}to{background-position:-120% 0}}
.go.ok,.yes.ok{background:#16A34A!important;background-image:none!important;color:#fff!important;opacity:1!important;animation:pop .38s ease-out}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.045)}100%{transform:scale(1)}}
.ck{width:20px;height:20px;margin-right:8px;vertical-align:-4px}.ck path{stroke-dasharray:26;stroke-dashoffset:26;animation:ckd .38s .08s ease-out forwards}@keyframes ckd{to{stroke-dashoffset:0}}
.go.shake{animation:shk .42s;background:var(--out)!important;background-image:none!important;color:#fff!important}@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.pwrap{position:relative;margin-top:10px}.pwrap .fld{padding-right:48px;margin-top:0}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;padding:0;border:0;background:none;color:var(--mute);display:grid;place-items:center;border-radius:12px}.eye svg,.tact svg{width:20px;height:20px}
.fgt{display:block;margin:2px 0 6px auto;padding:8px 2px;font-size:13.5px}
.tact{margin-left:auto;display:flex;gap:8px}.tact .rf{margin:0}
.fabw{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .2s}.fab svg{width:26px;height:26px}
.fabw.open .fab{transform:rotate(45deg)}.fabm{display:none;flex-direction:column;gap:8px;align-items:flex-end}.fabw.open .fabm{display:flex}
.fabm button{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:600 14px Inter,system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25)}.fabm svg{width:18px;height:18px}

@media (prefers-reduced-motion:reduce){.fab{transition:none}}

/* ---- auth redesign v2 (luxe, mobile-first) ---- */
.auv{position:fixed;inset:0;z-index:5;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;color:#fff;background:radial-gradient(120% 75% at 50% -12%,#1A4A8C 0%,#0C2B57 38%,#071330 70%,#040A18 100%)}
.auv::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(55% 36% at 92% 6%,rgba(255,122,99,.30),transparent 70%),radial-gradient(50% 34% at 4% 34%,rgba(70,140,250,.26),transparent 72%),radial-gradient(70% 30% at 50% 108%,rgba(233,201,138,.10),transparent 70%)}
.aw{position:relative;min-height:100%;display:flex;flex-direction:column;max-width:460px;margin:0 auto}

.atag::before,.atag::after{content:'';display:inline-block;width:22px;height:1px;vertical-align:middle;background:linear-gradient(90deg,transparent,rgba(233,201,138,.7));margin:0 12px 2px 0}.atag::after{transform:scaleX(-1);margin:0 0 2px 12px}

.apanel{position:relative;padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));border-radius:34px 34px 0 0;background:linear-gradient(180deg,#17325F 0%,#0C1C3E 52%,#081330 100%);border:1px solid rgba(255,255,255,.17);border-bottom:0;-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);box-shadow:0 -20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);animation:apin .6s .12s cubic-bezier(.2,.8,.2,1) both}

.aseg[data-p="1"]::before{transform:translateX(100%)}

.aload{display:flex;gap:8px;justify-content:center;padding:10px 0 60px}.aload i{width:8px;height:8px;border-radius:50%;background:#E9C98A;animation:ald 1s ease-in-out infinite}.aload i:nth-child(2){animation-delay:.15s}.aload i:nth-child(3){animation-delay:.3s}

    sb.from('entries').select('id,member_id,account_id,kind,amount_minor,occurred_on,note,category_id,created_at').eq('household_id',h).is('deleted_at',null).order('occurred_on',{ascending:false}).order('created_at',{ascending:false}).limit(3000),

  if(ex){const u=await sb.from('accounts').update({archived:false}).eq('id',ex.id).select('id');if(!u.error&&u.data&&u.data.length){ex.archived=false;return{id:ex.id}}}
